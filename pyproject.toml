[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-log-server"
version = "0.2.138"
description = "ALS-RS agent harness, extension adapter, KB/MCP tools, and TE2 integration."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
als-rs = "agent_log_server_rs.bootstrap:main"
als-rs-extension-adapter = "agent_log_server_rs.adapters.extension_adapter:main"

[project.optional-dependencies]
test = ["mcp==1.30.0", "pytest>=8", "pytest-subtests", "packaging"]
performance = [
  "uvloop==0.23.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "uvloop-te2==0.23.0.post1; sys_platform == 'android' and platform_machine == 'aarch64'",
]

[tool.setuptools]
include-package-data = true
py-modules = ["mcp_agent_pty_server", "te2_runtime"]
zip-safe = false

[tool.setuptools.packages.find]
include = ["als_deprecated*", "agent_log_server_rs*", "extensions*"]

[tool.setuptools.package-data]
als_deprecated = [
  "templates/*",
  "templates/**/*",
  "shellspec/*",
  "shellspec/**/*",
  "te2_assets/*",
  "te2_assets/**/*",
]
agent_log_server_rs = [
  "mcp_catalog.json",
  "native_mcp_build.json",
  "DEVELOPER_MESSAGE_TEMPLATE.md",
  "bin/*",
  "shellspec/*",
  "shellspec/**/*",
  "rust/*",
  "rust/**/*",
]
extensions = [
  "**/*",
]
"extensions.codex_ext" = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.py[cod]"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportAny = "warning"
reportExplicitAny = "warning"
include = [
  "*.py",
  "agent_log_server_rs",
  "extensions",
]
exclude = [
  "**/__pycache__",
  "als_deprecated",
  "als_deprecated.egg-info",
  "build",
  "node_modules",
  "worktrees",
]
reportMissingImports = "warning"
