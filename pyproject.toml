[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-log-server"
version = "0.2.24"
description = "FastAPI server for Codex Agent UI, agent log, and TE2-hosted orchestration."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
codex-agent = "agent_log_server.server:main"

[tool.setuptools]
include-package-data = true
py-modules = ["agent_index", "mcp_agent_pty_server", "mcp_agent_pty_http_shim", "shell_manager", "te2_runtime"]
zip-safe = false

[tool.setuptools.packages.find]
include = ["agent_log_server*", "extensions*", "te2_services*"]

[tool.setuptools.package-data]
agent_log_server = [
  "DEVELOPER_MESSAGE_TEMPLATE.md",
  "static/*",
  "static/**/*",
  "templates/*",
  "templates/**/*",
  "shellspec/*",
  "shellspec/**/*",
  "te2_assets/*",
  "te2_assets/**/*",
]
extensions = [
  "**/*",
]
"extensions.codex_ext" = ["**/*"]
"extensions.codex_ext_exp" = ["**/*"]
"extensions.copilot_sdk" = ["**/*"]
"extensions.copilot_sdk._vendor.copilot" = ["py.typed"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.py[cod]"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportAny = "warning"
reportExplicitAny = "warning"
include = [
  "*.py",
  "agent_index",
  "agent_log_server",
  "extensions",
  "te2_services",
]
exclude = [
  "**/__pycache__",
  "agent_log_server.egg-info",
  "build",
  "extensions/copilot_sdk/_vendor",
  "node_modules",
  "worktrees",
]
reportMissingImports = "warning"
