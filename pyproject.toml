[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-log-server"
version = "0.2.68"
description = "FastAPI server for Codex Agent UI, agent log, and TE2-hosted orchestration."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
als-rs = "agent_log_server_rs.bootstrap:main"
als-rs-copilot-adapter = "agent_log_server_rs.adapters.copilot_sdk_adapter:main"
als-rs-extension-adapter = "agent_log_server_rs.adapters.extension_adapter:main"
codex-agent = "als_deprecated.server:main"

[tool.setuptools]
include-package-data = true
py-modules = ["agent_index", "mcp_agent_pty_server", "mcp_agent_pty_http_shim", "shell_manager", "te2_runtime"]
zip-safe = false

[tool.setuptools.packages.find]
include = ["als_deprecated*", "agent_log_server_rs*", "extensions*"]

[tool.setuptools.package-data]
als_deprecated = [
  "DEVELOPER_MESSAGE_TEMPLATE.md",
  "templates/*",
  "templates/**/*",
  "shellspec/*",
  "shellspec/**/*",
  "te2_assets/*",
  "te2_assets/**/*",
]
agent_log_server_rs = [
  "shellspec/*",
  "shellspec/**/*",
  "rust/*",
  "rust/**/*",
]
extensions = [
  "**/*",
]
"extensions.codex_ext" = ["**/*"]
"extensions.copilot_sdk" = ["**/*"]
"extensions.copilot_sdk._vendor.copilot" = ["py.typed"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.py[cod]"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportAny = "warning"
reportExplicitAny = "warning"
include = [
  "*.py",
  "agent_index",
  "agent_log_server_rs",
  "extensions",
]
exclude = [
  "**/__pycache__",
  "als_deprecated",
  "als_deprecated.egg-info",
  "build",
  "extensions/copilot_sdk/_vendor",
  "node_modules",
  "worktrees",
]
reportMissingImports = "warning"
