version: "1"
shells:
  extension_adapter:
    backend: pipe
    pipe:
      mode: native_pipe_testing
    cwd: ${ctx:CWD}
    subgroups: ["als-rs", "extension-adapter", "jsonrpc", "observed"]
    inspect_hints:
      - json
      - jsonrpc
    command:
      - ${ctx:PYTHON}
      - -m
      - agent_log_server_rs.adapters.extension_adapter
