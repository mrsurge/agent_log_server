[package]
name = "als-mcp-embedding-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
pyo3 = { version = "=0.28.3", features = ["auto-initialize"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
schemars = "1.2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-std", "io-util"] }

[[bin]]
name = "als-mcp-embedding-probe"
path = "src/main.rs"

[[bin]]
name = "als-mcp"
path = "src/real_tools.rs"

[profile.dev]
debug = 0
