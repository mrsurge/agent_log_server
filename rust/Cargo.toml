[workspace]
members = [
    "crates/als-adapter-protocol",
    "crates/als-dto",
    "crates/als-jsonrpc",
    "crates/als-server",
    "crates/ferrous_framework",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/mrsurge/agent_log_server"
rust-version = "1.93"

[workspace.dependencies]
als-adapter-protocol = { path = "crates/als-adapter-protocol" }
als-dto = { path = "crates/als-dto" }
als-jsonrpc = { path = "crates/als-jsonrpc" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
ferrous_framework = { path = "crates/ferrous_framework" }
futures-util = "0.3"
getrandom = "0.3"
git2 = "0.20"
pyo3 = { version = "0.27", features = ["abi3-py311"] }
regex = "1"
rust_socketio = { version = "0.6", features = ["async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socketioxide = { version = "0.18", features = ["state"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
