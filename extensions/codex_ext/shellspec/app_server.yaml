version: "1"
shells:
  app_server_observed:
    backend: pipe
    pipe:
      mode: native_pipe_testing
    cwd: ${CWD}
    subgroups: ["als-rs", "app_server", "codex", "observed"]
    inspect_hints:
      - json
      - jsonrpc
    command:
      - codex
      - app-server
    env:
      PYTHON_GIL: '1'
      PYTHON_JIT: '0'
    labels:
      app: "codex-app-server-observed"
