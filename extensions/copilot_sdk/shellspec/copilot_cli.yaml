version: "1"
shells:
  copilot_cli:
    backend: pipe
    pipe:
      mode: native_pipe_testing
    cwd: ${CWD}
    subgroups: ["codex_agent", "copilot", "sdk", "observed"]
    inspect_hints:
      - json
      - jsonrpc
    command:
      - /data/data/com.termux/files/home/.local/share/copilot_runtime_manager/runtime/lib/node_modules/@github/copilot/index.js
      - --headless
      - --no-auto-update
      - --log-level
      - ${LOG_LEVEL}
      - --stdio
    labels:
      app: "copilot-sdk-cli"
