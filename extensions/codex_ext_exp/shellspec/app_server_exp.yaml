version: "1"
shells:
  app_server_exp:
    backend: pipe
    cwd: ${CWD}
    subgroups: ["codex_agent", "app_server", "codex_exp"]
    inspect_hints:
      - json
      - jsonrpc
    command:
      - /data/data/com.termux/files/home/downloads/codex/codex-rs/target/debug/codex-app-server
    labels:
      app: "codex-app-server-exp"
  app_server_exp_observed:
    backend: pipe
    cwd: ${CWD}
    subgroups: ["codex_agent", "app_server", "codex_exp", "observed"]
    inspect_hints:
      - json
      - jsonrpc
    command:
      - /data/data/com.termux/files/home/downloads/codex/codex-rs/target/debug/codex-app-server
    labels:
      app: "codex-app-server-exp-observed"
